<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">FluxMeld mark</title>
  <desc id="desc">A woven M-shaped mark representing converging model flows.</desc>
  <defs>
    <linearGradient id="background" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121A35"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <linearGradient id="flux" x1="214" y1="302" x2="812" y2="732" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37D7FF"/>
      <stop offset="0.48" stop-color="#7A7CFF"/>
      <stop offset="1" stop-color="#E27DFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#background)"/>
  <circle cx="512" cy="512" r="348" fill="#596BFF" opacity=".11"/>
  <path d="M234 744V300L512 588L790 300V744" fill="none" stroke="url(#flux)" stroke-linecap="round" stroke-linejoin="round" stroke-width="104" filter="url(#glow)"/>
  <path d="M234 300L512 588L790 300" fill="none" stroke="#EEF6FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="24" opacity=".9"/>
  <circle cx="234" cy="300" r="27" fill="#37D7FF"/>
  <circle cx="790" cy="300" r="27" fill="#E27DFF"/>
  <circle cx="512" cy="588" r="31" fill="#FFFFFF"/>
</svg>
